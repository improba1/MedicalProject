spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ============================
# Hikari Connection Pool
# ============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ========== JPA ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.connection.autocommit=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.dialect.storage_engine=default

# ========== Server (optional) ==========
server.port=8080

# ========== Logging ==========
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.engine.jdbc.batch.internal=DEBUG
logging.level.org.hibernate.engine.jdbc.spi=DEBUG

# ========== Auth ==========
application.security.jwt.secret-key=mysupersecretkeymysupersecretkey1234
application.security.jwt.expiration=3600000
application.security.jwt.refresh-token.expiration=604800000

# --- Swagger groups ---
springdoc.group-configs[0].group=doctor
springdoc.group-configs[0].paths-to-match=/api/v1/doctors/**

springdoc.group-configs[1].group=admin
springdoc.group-configs[1].paths-to-match=/api/v1/admin/**

springdoc.group-configs[2].group=public
springdoc.group-configs[2].paths-to-match=/api/v1/public/**

springdoc.group-configs[3].group=patient
springdoc.group-configs[3].paths-to-match=/api/v1/patient/**

springdoc.group-configs[4].group=superadmin
springdoc.group-configs[4].paths-to-match=/api/v1/superadmin/**


# --- Swagger UI sorting ---
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha


